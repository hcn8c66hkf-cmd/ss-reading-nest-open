name: Reading nest checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reading-nest-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests, type checks, and build
        run: |
          pnpm test
          pnpm typecheck
          pnpm build
